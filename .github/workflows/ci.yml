name: CI

on:
  push:
    branches: ["main", "feat/*"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: |
          if [ -f scripts/build-headless.mjs ] && [ -f index.html ]; then
            npm run build
          fi
      - run: |
          if [ -f scripts/verify-all.mjs ]; then
            npm run verify
          fi

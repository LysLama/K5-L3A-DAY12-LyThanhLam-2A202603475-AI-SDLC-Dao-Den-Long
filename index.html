<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đảo Đèn Lồng — Ba Hòn Đảo</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="hit-vignette" class="hit-vignette"></div>

    <!-- Off-screen directional pointer toward nearest unlit lantern -->
    <div id="hud-lantern-arrow" class="lantern-arrow hidden">
      <span id="hud-arrow-rotator" class="arrow-rotator"></span>
      <span id="hud-arrow-label" class="arrow-label"></span>
    </div>

    <!-- In-Game HUD -->
    <div id="hud-layer" class="hud hidden">
      <div class="hud-top">
        <div class="hud-group hud-left">
          <div id="hud-flames" class="pill hud-flames" title="Ngọn lửa còn lại"></div>
          <div id="hud-night-badge" class="pill hud-night-badge">Đêm 1 · Đảo Bến</div>
          <div id="hud-charm-badge" class="pill hud-charm hidden"></div>
          <div id="hud-lowfuel-badge" class="pill hud-lowfuel hidden"></div>
          <div id="hud-wind-badge" class="pill hud-wind hidden"></div>
        </div>

        <div class="hud-group hud-center">
          <div id="hud-timer" class="pill hud-timer"></div>
        </div>

        <div class="hud-group hud-right">
          <div id="hud-lanterns" class="pill hud-lanterns" title="Đèn Lồng Lớn"></div>
          <div id="hud-score" class="pill hud-score"></div>
          <button id="btn-mute" class="pill icon-btn" type="button" title="Bật/Tắt âm thanh [M]"></button>
          <button id="btn-help" class="pill icon-btn" type="button" title="Hướng dẫn phím [H]"></button>
          <button id="btn-pause" class="pill icon-btn" type="button" title="Tạm dừng [Esc / P]"></button>
        </div>
      </div>

      <div id="hud-toast" class="hud-toast hidden"></div>

      <div class="hud-bottom">
        <div id="hud-prompt" class="prompt hidden"></div>

        <div class="hud-action-row">
          <div id="hud-carried" class="pill hud-carried-slots" title="Đom đóm đang mang (10 → 20)"></div>
          <div id="hud-dash" class="pill ability-pill" title="Lướt nhanh [Shift]"></div>
          <div id="hud-pulse" class="pill ability-pill" title="Tỏa Sáng xua Bóng Mực [Q / R / Chuột phải]"></div>
        </div>

        <div id="controls-bar" class="controls-bar">
          <span><b>WASD</b> Di chuyển</span>
          <span><b>Kéo chuột / ← →</b> Camera</span>
          <span><b>Space</b> Nhảy</span>
          <span><b>Shift</b> Lướt</span>
          <span><b>E / F</b> Nạp đèn</span>
          <span><b>Q / Chuột phải</b> Tỏa Sáng</span>
          <span><b>Esc / P</b> Tạm dừng</span>
        </div>
      </div>
    </div>

    <!-- Main Menu Overlay -->
    <div id="screen-menu" class="overlay">
      <div class="overlay-card overlay-card--wide">
        <div id="menu-emblem" class="overlay-emblem"></div>
        <h1 class="brand-title">Đảo Đèn Lồng</h1>
        <p class="menu-sub">Hành trình giữ lửa qua Ba Đêm sương đen cùng Mây</p>

        <div class="menu-primary-cta">
          <button id="btn-start-campaign" class="btn-primary btn-lg" type="button">
            Bắt đầu Hành trình (Đêm 1 → 3)
          </button>
        </div>

        <div class="menu-section-label">Chọn Đêm chơi nhanh</div>
        <div class="night-select-row">
          <button id="btn-pick-night-1" class="night-tile" type="button">
            <span class="night-tile-num">Đêm 1</span>
            <span class="night-tile-name">Đảo Bến</span>
            <span class="night-tile-meta">Giữ ≥ 3/5 Đèn · 04:00</span>
          </button>
          <button id="btn-pick-night-2" class="night-tile" type="button">
            <span class="night-tile-num">Đêm 2</span>
            <span class="night-tile-name">Đảo Cau</span>
            <span class="night-tile-meta">Giữ ≥ 4/6 Đèn · 04:30</span>
          </button>
          <button id="btn-pick-night-3" class="night-tile" type="button">
            <span class="night-tile-num">Đêm 3</span>
            <span class="night-tile-name">Đảo Chuông</span>
            <span class="night-tile-meta">Giữ ≥ 5/7 Đèn · 05:00</span>
          </button>
        </div>

        <div class="overlay-actions">
          <button id="btn-menu-settings" class="btn-secondary" type="button">Cài đặt</button>
        </div>
      </div>
    </div>

    <!-- Night Intro Story Overlay (Ông Đăng) -->
    <div id="screen-intro" class="overlay hidden">
      <div class="overlay-card">
        <div id="intro-emblem" class="overlay-emblem"></div>
        <div id="intro-kicker" class="intro-kicker"></div>
        <h1 id="intro-title"></h1>
        <blockquote id="intro-quote" class="intro-quote"></blockquote>
        <div id="intro-meta" class="overlay-stats"></div>
        <div class="overlay-actions">
          <button id="btn-intro-play" class="btn-primary" type="button">Thắp đèn thôi! [Enter]</button>
          <button id="btn-intro-menu" class="btn-secondary" type="button">Về menu</button>
        </div>
      </div>
    </div>

    <!-- Pause & Settings Overlay -->
    <div id="screen-pause" class="overlay hidden">
      <div class="overlay-card">
        <div id="pause-emblem" class="overlay-emblem"></div>
        <h1 id="pause-title">Đang Tạm Dừng</h1>
        <p id="pause-sub">Hòn đảo vẫn lặng lẽ đợi ánh lửa từ bạn.</p>

        <div id="pause-settings-panel" class="settings-panel hidden">
          <label class="setting-row">
            <span>Âm lượng</span>
            <div class="setting-ctrl">
              <input id="input-volume" type="range" min="0" max="100" step="5" value="75" />
              <span id="val-volume" class="setting-val">75%</span>
            </div>
          </label>
          <label class="setting-row">
            <span>Độ nhạy camera</span>
            <div class="setting-ctrl">
              <input id="input-sensitivity" type="range" min="40" max="200" step="10" value="100" />
              <span id="val-sensitivity" class="setting-val">1.0×</span>
            </div>
          </label>
          <label class="setting-row">
            <span>Bảng màu dễ phân biệt</span>
            <div class="setting-ctrl">
              <input id="input-colorblind" type="checkbox" />
              <span id="val-colorblind" class="setting-val">Tắt</span>
            </div>
          </label>
        </div>

        <div class="overlay-actions overlay-actions--col">
          <button id="btn-pause-resume" class="btn-primary" type="button">Tiếp tục [P]</button>
          <button id="btn-pause-restart" class="btn-secondary" type="button">Chơi lại Đêm</button>
          <button id="btn-pause-settings" class="btn-secondary" type="button">Cài đặt</button>
          <button id="btn-pause-menu" class="btn-ghost" type="button">Về menu</button>
        </div>
      </div>
    </div>

    <!-- Result / Next Night / Dawn Victory Overlay -->
    <div id="screen-result" class="overlay hidden">
      <div class="overlay-card">
        <div id="result-emblem" class="overlay-emblem"></div>
        <h1 id="result-title">Đảo Đèn Lồng</h1>
        <p id="result-sub"></p>
        <div id="result-stats" class="overlay-stats"></div>
        <div class="overlay-actions">
          <button id="btn-result-next" class="btn-primary hidden" type="button">Sang Đêm tiếp theo → [Enter]</button>
          <button id="btn-result-retry" class="btn-primary" type="button">Chơi lại Đêm</button>
          <button id="btn-result-menu" class="btn-secondary" type="button">Về menu</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
